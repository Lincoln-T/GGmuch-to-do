version: "2.4"

services:
  mongodb:
    image: mongo:8.0
    container_name: muchtodo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: much_todo_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - muchtodo

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: muchtodo-backend:local
    container_name: muchtodo-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: "mongodb://root:example@mongodb:27017/much_todo_db?authSource=admin"
      DB_NAME: much_todo_db
      JWT_SECRET_KEY: change-this-dev-secret
      JWT_EXPIRATION_HOURS: 72
      ENABLE_CACHE: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - muchtodo

volumes:
  mongodb_data:
  mongodb_config:

networks:
  muchtodo:
    driver: bridge
