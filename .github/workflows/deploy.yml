name: Deploy Application

on:
  push:
    branches:
      - month-three-assessment
    paths:
      - "Client/**"
      - "Server/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  FRONTEND_DIR: Client
  BACKEND_DIR: Server/MuchToDo
  BACKEND_BINARY_NAME: muchtodo-backend
  VITE_API_BASE_URL: /api

jobs:
  deploy:
    name: Build and Deploy Full Stack App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Upload frontend to S3
        run: |
          aws s3 sync Client/dist "s3://${{ vars.FRONTEND_BUCKET_NAME }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: Server/MuchToDo/go.sum

      - name: Build backend binary
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          mkdir -p bin
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "bin/${BACKEND_BINARY_NAME}" ./cmd/api/main.go

      - name: Upload backend binary to artifact bucket
        run: |
          aws s3 cp \
            "${BACKEND_DIR}/bin/${BACKEND_BINARY_NAME}" \
            "s3://${{ vars.DEPLOYMENT_ARTIFACTS_BUCKET_NAME }}/backend/${BACKEND_BINARY_NAME}"

      - name: Find backend EC2 instances
        id: backend_instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ vars.BACKEND_ASG_NAME }}" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No InService backend instances found."
            exit 1
          fi

          echo "instance_ids=${INSTANCE_IDS}" >> "$GITHUB_OUTPUT"

      - name: Deploy backend through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.backend_instances.outputs.instance_ids }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MuchToDo backend binary" \
            --parameters commands="[
              \"set -e\",
              \"aws s3 cp s3://${{ vars.DEPLOYMENT_ARTIFACTS_BUCKET_NAME }}/backend/${BACKEND_BINARY_NAME} /usr/local/bin/${BACKEND_BINARY_NAME}\",
              \"chmod +x /usr/local/bin/${BACKEND_BINARY_NAME}\",
              \"systemctl restart muchtodo-backend\",
              \"systemctl status muchtodo-backend --no-pager\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command id: ${COMMAND_ID}"

          for INSTANCE_ID in ${{ steps.backend_instances.outputs.instance_ids }}; do
            aws ssm wait command-executed \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}"

            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text
          done
