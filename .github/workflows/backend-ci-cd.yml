name: Backend CI/CD

on:
  push:
    branches:
      - month-three-assessment
    paths:
      - "Server/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  BACKEND_DIR: Server/MuchToDo
  IMAGE_TAG: latest

jobs:
  backend:
    name: Test, build, scan, push, and deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache-dependency-path: Server/MuchToDo/go.sum

      - name: Run Go tests
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          go mod download
          go test ./...

      - name: Run Go vet
        working-directory: ${{ env.BACKEND_DIR }}
        run: go vet ./...

      - name: Run Go vulnerability check
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -t "${{ vars.BACKEND_ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}" \
            "${{ env.BACKEND_DIR }}"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.BACKEND_ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Push backend Docker image to ECR
        run: |
          docker push "${{ vars.BACKEND_ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}"

      - name: Find backend EC2 instances
        id: backend_instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ vars.BACKEND_ASG_NAME }}" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No InService backend instances found."
            exit 1
          fi

          echo "instance_ids=${INSTANCE_IDS}" >> "$GITHUB_OUTPUT"

      - name: Deploy Docker image to EC2 through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.backend_instances.outputs.instance_ids }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MuchToDo backend Docker image" \
            --parameters commands="[
              \"set -e\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.BACKEND_ECR_REPOSITORY_URL }}\",
              \"docker pull ${{ vars.BACKEND_ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}\",
              \"docker rm -f muchtodo-backend || true\",
              \"docker run -d --name muchtodo-backend --restart unless-stopped --env-file /opt/muchtodo/.env -p 8080:8080 ${{ vars.BACKEND_ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}\",
              \"docker ps\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command id: ${COMMAND_ID}"

          for INSTANCE_ID in ${{ steps.backend_instances.outputs.instance_ids }}; do
            aws ssm wait command-executed \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}"

            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text
          done

      - name: Smoke test backend health endpoint
        run: |
          sleep 30
          curl -f "${{ vars.BACKEND_API_URL }}/health"

      - name: Deployment notification
        run: |
          echo "Backend Docker image deployed successfully."
