name: Frontend CI/CD

on:
  push:
    branches:
      - month-three-assessment
    paths:
      - "Client/**"
      - ".github/workflows/frontend-ci-cd.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  FRONTEND_DIR: Client
  VITE_API_BASE_URL: /api

jobs:
  frontend:
    name: Build, scan, and deploy frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm install

      - name: Run frontend tests if available
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm test --if-present

      - name: Run npm audit
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm audit --audit-level=high

      - name: Build production frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Deploy frontend to S3
        run: |
          aws s3 sync Client/dist "s3://${{ vars.FRONTEND_BUCKET_NAME }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Deployment notification
        run: |
          echo "Frontend deployed successfully to CloudFront."
